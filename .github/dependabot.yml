version: 2

# Minor and patch updates are grouped into one PR per ecosystem; major updates
# stay as individual PRs so they get a proper look.
updates:
  - package-ecosystem: nuget
    directory: /
    schedule: { interval: weekly }
    labels: [dependencies]
    commit-message: { prefix: "chore(deps)" }
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    labels: [dependencies]
    commit-message: { prefix: "chore(deps)" }
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    labels: [dependencies, ci]
    commit-message: { prefix: "ci(deps)" }
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    labels: [dependencies, docker]
    commit-message: { prefix: "chore(deps)" }
