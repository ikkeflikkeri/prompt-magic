version: 2

# Minor and patch updates are grouped into one PR per ecosystem and are auto-merged once CI passes
# (see .github/workflows/dependabot-auto-merge.yml). Major updates stay as individual PRs for review.
#
# `cooldown` makes Dependabot wait after a version is published before proposing it, which gives the
# ecosystem time to spot and yank a bad or malicious release before it can be auto-merged.
# It applies to version updates only; security updates are never delayed.
# The per-semver-level days (semver-*-days) are only supported for some ecosystems (nuget, npm here);
# github-actions and docker accept only default-days.
updates:
  - package-ecosystem: nuget
    directory: /
    schedule: { interval: weekly }
    labels: [dependencies]
    commit-message: { prefix: "chore(deps)" }
    cooldown:
      default-days: 5
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 14
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    labels: [dependencies]
    commit-message: { prefix: "chore(deps)" }
    cooldown:
      default-days: 5
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 14
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    labels: [dependencies, ci]
    commit-message: { prefix: "ci(deps)" }
    cooldown:
      default-days: 5
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    labels: [dependencies, docker]
    commit-message: { prefix: "chore(deps)" }
    cooldown:
      default-days: 5
